name: Fetch jersey numbers
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 && python3 tools/fetch_numbers.py 2>&1 | tee tools/fetch-numbers-log.txt
        shell: bash
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/jersey-numbers-2026.json tools/fetch-numbers-log.txt
          git diff --cached --quiet || git commit -m "Add current jersey numbers"
          git pull --rebase
          git push
