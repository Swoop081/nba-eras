name: Fetch player stats
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pandas lxml html5lib
      - run: python3 tools/fetch_bbref.py 2026 2>&1 | tee tools/fetch-stats-log.txt
        shell: bash
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add tools/data-2025 tools/fetch-stats-log.txt
          git diff --cached --quiet || git commit -m "Add Basketball Reference tables for 2025-26"
          git pull --rebase -q origin main || true
          git push
