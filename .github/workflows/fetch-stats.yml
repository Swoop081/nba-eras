name: Fetch player stats
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Basketball Reference season years, space separated'
        default: '2026'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: pip install pandas lxml html5lib
      - run: python3 tools/fetch_bbref.py ${{ github.event.inputs.seasons }} 2>&1 | tee tools/fetch-stats-log.txt
        shell: bash
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add tools/data-* tools/fetch-stats-log.txt
          git diff --cached --quiet || git commit -m "Add Basketball Reference tables"
          git pull --rebase -q origin main || true
          git push
