name: Fetch franchise history
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 && python3 tools/fetch_history.py 2>&1 | tee tools/fetch-history-log.txt
        shell: bash
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/franchise-history.json tools/fetch-history-log.txt
          git diff --cached --quiet || git commit -m "Add franchise championship and retired-number data"
          git pull --rebase
          git push
