name: Fetch rosters
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python3 tools/fetch_rosters.py 2>&1 | tee tools/fetch-rosters-log.txt
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/rosters-wiki-2026.json tools/fetch-rosters-log.txt
          git diff --cached --quiet || git commit -m "Wikipedia rosters"
          git pull --rebase -q origin main || true
          git push
