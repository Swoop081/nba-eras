name: Fetch coach photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install "opencv-python-headless<5" pillow numpy
      - run: python3 tools/fetch_coaches.py 2>&1 | tee tools/fetch-coaches-log.txt
        shell: bash
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add assets tools/fetch-coaches-log.txt
          git diff --cached --quiet || git commit -m "Add coach photos"
          git pull --rebase
          git push
