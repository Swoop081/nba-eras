<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NBA Eras">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>NBA Eras</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-era-filter="on" data-phase="modern">

<canvas id="grain" aria-hidden="true"></canvas>
<div id="scan" aria-hidden="true"></div>
<div id="sweep" aria-hidden="true"></div>

<main id="app">

<section id="screen-title" class="screen active" aria-label="Main menu">
  <div class="title-stack">
    <div class="logo-wrap">
      <img id="logo" src="assets/nba-logo.png?v=2" alt="NBA logo" width="160" height="320">
      <div id="wordmark" class="wordmark" hidden>NBA</div>
    </div>
    <h1 id="game-title">NBA ERAS</h1>
    <p id="tagline">What history will you write?</p>
  </div>
  <nav id="title-menu" class="menu" aria-label="Menu">
    <button class="btn primary" id="btn-new" type="button">New game</button>
    <button class="btn" id="btn-continue" type="button" disabled>Continue</button>
    <button class="btn" id="btn-settings" type="button">Settings</button>
  </nav>
  <p id="skip-hint" class="hint">Tap to skip intro</p>
</section>

<section id="screen-era" class="screen" aria-label="Choose your era">
  <header class="bar">
    <button class="back" data-back="screen-title" type="button" aria-label="Back">&larr;</button>
    <div>
      <h2>Choose your era</h2>
      <p class="sub">You will live through every era after the one you pick.</p>
    </div>
  </header>
  <div id="era-list" class="list"></div>
</section>

<section id="screen-team" class="screen" aria-label="Choose your franchise">
  <header class="bar">
    <button class="back" data-back="screen-era" type="button" aria-label="Back">&larr;</button>
    <div>
      <h2>Choose your franchise</h2>
      <p class="sub" id="team-sub"></p>
    </div>
  </header>
  <div id="team-list" class="list"></div>
  <div class="dock" id="team-dock" hidden>
    <button class="btn primary wide" id="btn-take" type="button">Take over</button>
  </div>
</section>

<section id="screen-ready" class="screen" aria-label="Franchise confirmed">
  <header class="bar">
    <button class="back" data-back="screen-team" type="button" aria-label="Back">&larr;</button>
    <div><h2>You are the GM</h2></div>
  </header>
  <div class="ready-card">
    <div id="ready-badge" class="badge big"></div>
    <h3 id="ready-name"></h3>
    <p id="ready-line"></p>
    <button class="btn primary wide" id="btn-play" type="button">Start the season</button>
    <p class="sub">A new game replaces any saved season.</p>
  </div>
</section>

<section id="screen-season" class="screen" aria-label="Season">
  <header class="bar">
    <button class="back" data-back="screen-title" type="button" aria-label="Menu">&larr;</button>
    <div>
      <h2 id="season-title">Season</h2>
      <p class="sub" id="season-sub"></p>
    </div>
  </header>
  <div id="season-body" class="list"></div>
  <div class="dock" id="season-dock">
    <button class="btn primary wide" id="btn-next" type="button">Play game</button>
    <div class="dock-row">
      <button class="btn" id="btn-simweek" type="button">Sim a week</button>
      <button class="btn" id="btn-simrest" type="button">Sim to playoffs</button>
    </div>
  </div>
</section>

<section id="screen-events" class="screen" aria-label="Today">
  <header class="bar">
    <div>
      <h2 id="ev-title">Today</h2>
      <p class="sub" id="ev-sub"></p>
    </div>
  </header>
  <div id="ev-body" class="list"></div>
  <div class="dock" id="ev-dock"></div>
</section>

<section id="screen-trade" class="screen" aria-label="Trades">
  <header class="bar">
    <button class="back" id="trade-back" type="button" aria-label="Back">&larr;</button>
    <div>
      <h2 id="trade-title">Trades</h2>
      <p class="sub" id="trade-sub"></p>
    </div>
  </header>
  <div id="trade-body" class="list"></div>
  <div class="dock" id="trade-dock"></div>
</section>

<section id="screen-off" class="screen" aria-label="Off-season">
  <header class="bar">
    <div>
      <h2 id="off-title">Off-season</h2>
      <p class="sub" id="off-sub"></p>
    </div>
  </header>
  <div id="off-body" class="list"></div>
  <div class="dock" id="off-dock"></div>
</section>

<section id="screen-roster" class="screen" aria-label="Roster">
  <header class="bar">
    <button class="back" data-back="screen-season" type="button" aria-label="Back">&larr;</button>
    <div>
      <h2 id="roster-title">Roster</h2>
      <p class="sub" id="roster-sub"></p>
    </div>
  </header>
  <div id="roster-list" class="list"></div>
</section>

<section id="screen-live" class="screen" aria-label="Live game">
  <div id="live-top" class="live-top"></div>
  <div id="court" class="court"></div>
  <div id="ticker" class="ticker" aria-live="polite"></div>
  <div class="dock" id="live-dock"></div>
</section>

<section id="screen-match" class="screen" aria-label="Game">
  <header class="bar">
    <button class="back" data-back="screen-season" type="button" aria-label="Back">&larr;</button>
    <div>
      <h2 id="match-title">Game</h2>
      <p class="sub" id="match-sub"></p>
    </div>
  </header>
  <div id="match-body" class="list"></div>
  <div class="dock" id="match-dock" hidden>
    <button class="btn primary wide" id="btn-again" type="button">Back to the season</button>
  </div>
</section>

<section id="screen-settings" class="screen" aria-label="Settings">
  <header class="bar">
    <button class="back" data-back="screen-title" type="button" aria-label="Back">&larr;</button>
    <div><h2>Settings</h2></div>
  </header>
  <div class="list">
    <label class="setting">
      <span>
        <strong>Era filter</strong>
        <span class="sub">Reskins the app to match each era. Off keeps the modern look while rules and news stay era-correct.</span>
      </span>
      <input id="era-filter" type="checkbox" checked>
    </label>
    <label class="setting">
      <span>
        <strong>Intro animation</strong>
        <span class="sub">Plays the flicker and grain transition on the main menu.</span>
      </span>
      <input id="intro-anim" type="checkbox" checked>
    </label>
  </div>
</section>

</main>

<script src="engine.js"></script>
<script src="season.js"></script>
<script src="events.js"></script>
<script src="league.js"></script>
<script src="history.js"></script>
<script src="app.js"></script>
</body>
</html>
